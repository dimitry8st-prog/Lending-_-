<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Медведь в экипировке боевого самбо">
  <defs>
    <linearGradient id="fur" x1="24" y1="18" x2="104" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B3E22"/>
      <stop offset=".55" stop-color="#4A2A16"/>
      <stop offset="1" stop-color="#2E180C"/>
    </linearGradient>
    <linearGradient id="kurtka" x1="28" y1="70" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F03A3F"/>
      <stop offset="1" stop-color="#B4181D"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="64" cy="64" r="62"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <circle cx="64" cy="64" r="62" fill="#0D2638"/>
  <circle cx="64" cy="64" r="58" fill="#173E59" stroke="#E32A2F" stroke-width="4"/>

  <g clip-path="url(#round)">
    <!-- ears -->
    <ellipse cx="34" cy="34" rx="14" ry="13" fill="url(#fur)"/>
    <ellipse cx="94" cy="34" rx="14" ry="13" fill="url(#fur)"/>
    <ellipse cx="34" cy="35" rx="7" ry="6.5" fill="#C47A52"/>
    <ellipse cx="94" cy="35" rx="7" ry="6.5" fill="#C47A52"/>

    <!-- head -->
    <ellipse cx="64" cy="52" rx="34" ry="32" fill="url(#fur)"/>

    <!-- snout -->
    <ellipse cx="64" cy="62" rx="16" ry="13" fill="#D9A07A"/>
    <ellipse cx="64" cy="58" rx="7" ry="5" fill="#2A160C"/>
    <path d="M57 66c3.2 4 10.8 4 14 0" stroke="#2A160C" stroke-width="2.2" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="50" cy="48" rx="4.2" ry="5" fill="#120A06"/>
    <ellipse cx="78" cy="48" rx="4.2" ry="5" fill="#120A06"/>
    <circle cx="51.3" cy="46.5" r="1.3" fill="#FFF"/>
    <circle cx="79.3" cy="46.5" r="1.3" fill="#FFF"/>

    <!-- brows -->
    <path d="M42 42c5-4 12-3 15 0" stroke="#1A0E08" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M71 42c5-4 12-3 15 0" stroke="#1A0E08" stroke-width="2.4" stroke-linecap="round"/>

    <!-- sambo headguard / band -->
    <path d="M30 46c4-16 22-26 34-26s30 10 34 26" stroke="#0D2638" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M36 45c3.5-12 17-20 28-20s24.5 8 28 20" stroke="#E32A2F" stroke-width="2.5" fill="none"/>

    <!-- shoulders / kurtka -->
    <path d="M18 118c6-28 22-40 46-40s40 12 46 40" fill="url(#kurtka)"/>
    <!-- blue side panel (combat sambo jacket style) -->
    <path d="M64 78c-10 0-18 6-22 16h44c-4-10-12-16-22-16Z" fill="#173E59" opacity=".35"/>
    <!-- lapels -->
    <path d="M48 82l-8 36h14l6-36H48Z" fill="#F7F2EA"/>
    <path d="M80 82l8 36H74l-6-36h12Z" fill="#F7F2EA"/>
    <!-- belt knot -->
    <rect x="46" y="104" width="36" height="8" rx="2" fill="#0D2638"/>
    <path d="M58 104v18M70 104v18" stroke="#F7F2EA" stroke-width="2"/>
    <!-- collar tabs -->
    <circle cx="52" cy="88" r="2.4" fill="#0D2638"/>
    <circle cx="76" cy="88" r="2.4" fill="#0D2638"/>

    <!-- open-finger gloves hint -->
    <ellipse cx="28" cy="112" rx="10" ry="7" fill="#0D2638"/>
    <ellipse cx="100" cy="112" rx="10" ry="7" fill="#0D2638"/>
    <path d="M22 110h12M90 110h12" stroke="#E32A2F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
